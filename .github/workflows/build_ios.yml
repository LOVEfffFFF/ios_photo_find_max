name: Build iOS IPA

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型'
        required: true
        default: 'release'
        type: choice
        options:
          - debug
          - release

jobs:
  build:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          # 锁定验证过的版本：'stable' 是滚动分支，Flutter 升级会导致
          # 「上次能编、这次编不过」
          flutter-version: '3.47.6'
          cache: true

      - name: Verify Flutter installation
        run: |
          flutter --version
          echo "===== BUILD ENVIRONMENT ====="
          echo "runner.image : ${{ runner.os }} / ${{ runner.arch }}"
          xcodebuild -version
          echo "sdk          : $(xcrun --sdk iphoneos --show-sdk-version)"
          echo "macos        : $(sw_vers -productVersion)"
          echo "=============================="

      - name: Generate iOS project files
        run: |
          # 只让 flutter 生成缺失的工程文件（pbxproj / storyboard 等）。
          # 仓库里已存在 ios/Runner/AppDelegate.swift 与 Info.plist，
          # flutter create 不会覆盖它们 —— 这是本项目的原生桥能进包的关键。
          flutter create --platforms=ios --org com.photosize --project-name photo_size .

      - name: Install dependencies
        run: flutter pub get

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Configure Xcode project for CI build
        run: |
          PBXPROJ="ios/Runner.xcodeproj/project.pbxproj"
          sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*/IPHONEOS_DEPLOYMENT_TARGET = 17.0/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "iPhone Developer"/CODE_SIGN_IDENTITY = ""/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development"/CODE_SIGN_IDENTITY = ""/g' "$PBXPROJ"
          sed -i '' 's/CODE_SIGN_STYLE = Automatic/CODE_SIGN_STYLE = Manual/g' "$PBXPROJ"
          sed -i '' '/PRODUCT_BUNDLE_IDENTIFIER/a\
            \t\t\tCODE_SIGNING_ALLOWED = NO;\
            \t\t\tCODE_SIGNING_REQUIRED = NO;\
            \t\t\tDEVELOPMENT_TEAM = "";' "$PBXPROJ"
          for CFG in ios/Flutter/Debug.xcconfig ios/Flutter/Release.xcconfig ios/Flutter/Profile.xcconfig; do
            if [ -f "$CFG" ]; then
              printf '\nDEVELOPMENT_TEAM =\nCODE_SIGN_IDENTITY =\nCODE_SIGNING_REQUIRED = NO\nCODE_SIGNING_ALLOWED = NO\n' >> "$CFG"
            fi
          done
          echo "=== Patched project.pbxproj ==="
          grep "IPHONEOS_DEPLOYMENT_TARGET" "$PBXPROJ" || true
          grep -c "CODE_SIGNING_ALLOWED = NO" "$PBXPROJ" || true

      - name: Build iOS App (Debug)
        if: github.event.inputs.build_type == 'debug'
        run: |
          tr -d '\r' < .github/scripts/build_ios.sh > /tmp/build_ios.sh
          bash /tmp/build_ios.sh Debug

      - name: Build iOS App (Release)
        if: github.event.inputs.build_type != 'debug'
        run: |
          tr -d '\r' < .github/scripts/build_ios.sh > /tmp/build_ios.sh
          bash /tmp/build_ios.sh Release

      - name: Create Payload and IPA
        run: |
          mkdir -p Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r PhotoSize.ipa Payload/
          rm -rf Payload
          echo "IPA size: $(du -sh PhotoSize.ipa | cut -f1)"
          echo ""
          echo "============================================"
          echo "  Target: iPhone (arm64) / iOS 17.0+"
          echo "  Bundle: com.photosize.photoSize"
          echo "============================================"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PhotoSize-${{ github.sha }}
          path: PhotoSize.ipa
          retention-days: 3

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-${{ github.sha }}
          path: |
            build/
            ios/build/
          retention-days: 1

  analyze:
    name: Code Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run unit tests
        run: flutter test
